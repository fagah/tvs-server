spring:
    application:
        name:   tvs-server-api
    datasource:
        url: jdbc:postgresql://localhost:5432/tact_voting_system
        username: postgres
        password: postgres
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
    
    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: false
        show-sql: false
    
    flyway:
        enabled: true
        baseline-on-migrate: true
        locations: classpath:db/migration

server:
    port: 8080
    
logging:
    level:
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

tact:
    security:
        jwt:
            secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
            expiration: 86400000 # a day
            refresh-token:
                expiration: 604800000 # 7 days
    cors:
        allowed-origins: 
            - http://localhost:4200
            - http://localhost:3000
        allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
        allowed-headers:
            - Authorization
            - Content-Type
            - X-Requested-With
            - Accept
        allow-credentials: true
    max-age: 3600 # 1 hour in seconds
    country:
        name: Ivory Coast
        code: CI
    openapi:
        dev-url: http://localhost:8080
        prod-url: https://api.tact.ci